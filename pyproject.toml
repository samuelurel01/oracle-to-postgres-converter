[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-to-postgres-converter"
version = "0.1.0"
description = "Simple Oracle to PostgreSQL table converter using SELECT/INSERT batches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "oracledb>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
oracle-to-postgres = "oracle_to_postgres_converter.cli:main"
oracle-to-postgres-web = "oracle_to_postgres_converter.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
